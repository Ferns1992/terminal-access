<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal Access</title>
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/xterm.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app">
  <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <img src="/img/icon.svg" alt="">
      <h1>Terminal Access</h1>
      <button class="icon-btn" id="themeBtn" title="Toggle theme (dark/light)" aria-label="Toggle theme">🌗</button>
    </div>

    <div class="side-actions">
      <button class="btn" id="addBtn" style="font-size:13px;padding:9px">＋ Add Server</button>
      <button class="icon-btn" id="logoutBtn" title="Sign out" aria-label="Sign out" style="margin-left:0">🚪</button>
    </div>

    <div class="search">
      <input id="search" type="search" placeholder="🔍 Filter servers…" spellcheck="false">
    </div>

    <div class="conn-list" id="connList"></div>

    <div class="metrics" id="metrics" hidden>
      <div class="group-label">📊 Live Metrics</div>
      <div class="metric-grid">
        <div class="metric">
          <div class="metric-label">CPU</div>
          <div class="metric-val" id="mCpu">—</div>
          <div class="bar"><i id="bCpu" style="width:0%"></i></div>
        </div>
        <div class="metric">
          <div class="metric-label">Memory</div>
          <div class="metric-val" id="mMem">—</div>
          <div class="bar"><i id="bMem" style="width:0%"></i></div>
        </div>
        <div class="metric">
          <div class="metric-label">Disk</div>
          <div class="metric-val" id="mDsk">—</div>
          <div class="bar"><i id="bDsk" style="width:0%"></i></div>
        </div>
        <div class="metric">
          <div class="metric-label">Load</div>
          <div class="metric-val" id="mLoad">—</div>
          <div class="bar"><i id="bLoad" style="width:0%"></i></div>
        </div>
      </div>
      <div style="font-size:10.5px;color:var(--text-dim);margin-top:8px;font-family:var(--mono)" id="mUp"></div>
    </div>
  </aside>

  <!-- ── Main ────────────────────────────────────────────────────────── -->
  <main class="main">
    <div class="tabbar" id="tabbar">
      <button class="icon-btn" id="menuBtn" title="Menu" aria-label="Toggle sidebar" style="margin-left:0">☰</button>
    </div>

    <div class="term-pane" id="pane"></div>

    <div class="empty" id="empty">
      <div>
        <div class="empty-emoji">🖥️</div>
        <h2>No active session</h2>
        <p>Pick a server from the sidebar to open a terminal, or add a new one to get started.</p>
      </div>
    </div>

    <div class="status-bar">
      <span><span class="dot" id="sDot" style="background:var(--text-dim)"></span><b id="sState">Offline</b></span>
      <span>📡 <b id="sSrv">0</b> servers</span>
      <span>🔌 <b id="sSes">0</b> active</span>
      <span style="margin-left:auto">v2.0</span>
    </div>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<div id="modalHost"></div>

<script src="/js/xterm.min.js"></script>
<script src="/js/xterm-addon-fit.min.js"></script>
<script src="/js/xterm-addon-web-links.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
